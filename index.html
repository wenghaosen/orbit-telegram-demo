<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101429"><title>点亮星球 · Mini Demo</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>
*{box-sizing:border-box}body{margin:0;background:#101429;color:#f5f4ff;font-family:system-ui,-apple-system,"PingFang SC",sans-serif;min-height:100dvh;background-image:radial-gradient(ellipse at 70% 25%,#42307266,transparent 60%)}main{max-width:480px;margin:auto;padding:calc(28px + var(--app-safe-top, env(safe-area-inset-top, 0px))) calc(24px + var(--app-safe-right, env(safe-area-inset-right, 0px))) calc(35px + var(--app-safe-bottom, env(safe-area-inset-bottom, 0px))) calc(24px + var(--app-safe-left, env(safe-area-inset-left, 0px)))}header{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:#b6b6d4}.badge{border:1px solid #68608666;border-radius:20px;padding:7px 11px}h1{font-size:36px;letter-spacing:-1px;margin:38px 0 12px}p{color:#b6b6d4;line-height:1.7;font-size:15px}.planet-zone{display:grid;place-items:center;height:290px;position:relative}.orbit{position:absolute;width:280px;height:125px;border:1px solid #c1a1ff55;border-radius:50%;transform:rotate(-25deg);pointer-events:none}.planet{border:0;width:193px;height:193px;border-radius:50%;background:radial-gradient(circle at 30% 25%,#e4d7ff,#ae86ef 35%,#5b3ba4 75%);box-shadow:0 0 80px #a37fe533,inset -20px -15px 40px #261a5a77;cursor:pointer;transition:transform .12s;position:relative;touch-action:manipulation;-webkit-tap-highlight-color:transparent}.planet:active{transform:scale(.94)}.planet:focus-visible{outline:3px solid #fff;outline-offset:8px}.planet::after{content:'✦';font-size:53px;color:#ffffffcc;position:absolute;left:62px;top:61px}.hint{text-align:center;margin-top:-8px;font-size:13px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:28px 0 20px}.card{background:#ffffff07;border:1px solid #ffffff10;border-radius:19px;padding:19px}.label{font-size:12px;color:#b6b6d4}.value{font-size:29px;font-weight:650;margin-top:7px}.progress{height:7px;background:#ffffff12;border-radius:20px;overflow:hidden;margin:16px 0 9px}.bar{height:100%;background:linear-gradient(90deg,#a98bff,#e2bcff);width:0;transition:width .2s}.next{font-size:12px;color:#b6b6d4;display:flex;justify-content:space-between}.reset{background:transparent;border:1px solid #ffffff25;color:#c6c1dc;border-radius:14px;padding:14px;width:100%;margin-top:26px;font-size:14px;cursor:pointer}footer{font-size:11px;text-align:center;color:#77768f;margin-top:22px}.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#eee8ff;color:#342455;padding:12px 22px;border-radius:30px;display:none;font-size:14px;white-space:nowrap}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><main><header><span>ORBIT / 轨道实验室</span><span class="badge" id="mode">网页体验</span></header><h1>点亮你的小宇宙</h1><p id="greeting">每一次轻触，都让星球更闪耀。<br>从第一束星光开始吧。</p><div class="planet-zone"><div class="orbit"></div><button class="planet" id="tap" aria-label="点击星球收集一束星光"></button></div><p class="hint">轻触星球，收集星光 +1</p><div class="stats"><div class="card"><div class="label">收集的星光</div><div class="value" id="score" aria-live="polite">0</div></div><div class="card"><div class="label">当前称号</div><div class="value" id="rank" style="font-size:23px">星际旅人</div></div></div><div class="progress"><div class="bar" id="bar"></div></div><div class="next"><span id="goal">下一目标：10 束星光</span><span id="fraction">0 / 10</span></div><button class="reset" id="reset">重新开始</button><footer>Telegram Mini App 演示 · 进度仅保存在当前设备<br>无支付 · 无广告 · 无服务器用户数据存储</footer></main><div class="toast" id="toast" role="status"></div><script>
const tg=window.Telegram?.WebApp;let score=0;try{score=Math.max(0,parseInt(localStorage.getItem('orbit-demo-score')||'0',10)||0)}catch{}if(tg?.initData){tg.ready();tg.expand();tg.setHeaderColor('#101429');tg.setBackgroundColor('#101429');document.getElementById('mode').textContent='Telegram Mini App';
  // Telegram provides system and overlay insets separately in fullscreen.
  function updateSafeArea(){
    const system=tg.safeAreaInset||{}, content=tg.contentSafeAreaInset||{};
    for(const side of ['top','right','bottom','left']){
      const inset=Math.max(0,Number(system[side])||0)+Math.max(0,Number(content[side])||0);
      document.documentElement.style.setProperty(`--app-safe-${side}`,`max(env(safe-area-inset-${side}, 0px), ${inset}px)`);
    }
  }
  updateSafeArea();
  tg.onEvent('safeAreaChanged',updateSafeArea);
  tg.onEvent('contentSafeAreaChanged',updateSafeArea);
  tg.onEvent('fullscreenChanged',updateSafeArea);
  if(tg.isVersionAtLeast('8.0') && typeof tg.requestFullscreen==='function' && !tg.isFullscreen){
    tg.onEvent('fullscreenFailed',()=>{tg.expand();updateSafeArea()});
    try{tg.requestFullscreen()}catch{tg.expand()}
  }
}
const levels=[{n:0,name:'星际旅人'},{n:10,name:'追光者'},{n:30,name:'星球守护者'},{n:100,name:'宇宙探索家'}];function render(){const level=levels.filter(l=>score>=l.n).at(-1),next=levels.find(l=>score<l.n);document.getElementById('score').textContent=score;document.getElementById('rank').textContent=level.name;document.getElementById('goal').textContent=next?`下一目标：${next.n} 束星光`:'全部称号已解锁，继续探索吧';document.getElementById('fraction').textContent=next?`${score} / ${next.n}`:'已达成';document.getElementById('bar').style.width=next?`${(score-level.n)/(next.n-level.n)*100}%`:'100%';try{localStorage.setItem('orbit-demo-score',String(score))}catch{}}
let timer;function toast(s){const el=document.getElementById('toast');el.textContent=s;el.style.display='block';clearTimeout(timer);timer=setTimeout(()=>el.style.display='none',1800)}document.getElementById('tap').onclick=()=>{score++;render();tg?.HapticFeedback?.impactOccurred('light');const level=levels.find(l=>l.n===score);if(level)toast(`已解锁：${level.name}`)};document.getElementById('reset').onclick=()=>{if(confirm('清空星光进度，重新开始？')){score=0;render();toast('新的旅程开始了')}};render();
</script></body></html>
